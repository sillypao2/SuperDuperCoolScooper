<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d6336c">
<title>Freezer Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap">
<!-- Ice Cream Scooper: open source (MIT). Demo prototype: data lives in this browser only. -->
<style>
:root{--bg:#eef7fb;--card:#fff;--ink:#4a2c2a;--mute:#8a7370;--line:#dcebf1;--berry:#ee5c85;--blue:#5b6fd6;--sky:#dff0f7}
@media (prefers-color-scheme:dark){:root{--bg:#1b2226;--card:#263036;--ink:#f8ebe8;--mute:#aebcc2;--line:#37454c;--sky:#2d3b42}}
*{box-sizing:border-box}
body{margin:0;font-family:ui-rounded,"Nunito",system-ui,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:20px 16px 48px;max-width:1120px;margin:auto;line-height:1.4}
h1,h2,.count,.tn{font-family:"Fredoka",ui-rounded,system-ui,sans-serif}
h1{font-size:26px;margin:0;font-weight:600}h2{font-size:21px;margin:34px 0 12px;font-weight:600}
.sub{color:var(--mute);margin:0 0 16px;font-size:15px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:50%;background:var(--berry);display:grid;place-items:center;font-size:28px;box-shadow:0 4px 0 #c2456a}
.brand small{display:block;color:var(--mute);font-size:13px}
button{font:inherit;cursor:pointer;border:0;border-radius:99px;transition:transform .1s}
button:active{transform:scale(.96)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{background:var(--berry);color:#fff;padding:13px 22px;font-weight:700}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.strip{display:grid;grid-template-columns:1.1fr 1fr 1fr;background:var(--card);border-radius:24px;border:2px solid var(--line);overflow:hidden}
.strip>div{padding:18px 22px}.strip>div+div{border-left:2px dashed var(--line)}
.big b{font-family:"Fredoka",system-ui,sans-serif;font-size:60px;line-height:1;color:var(--berry);display:block}
.big span,.per p{color:var(--mute);font-size:15px}
.per h3{margin:0 0 6px;font-size:16px}.per p{margin:2px 0}.per b{color:var(--ink);font-size:20px;margin-right:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.tub{border-radius:22px 22px 26px 26px;background:var(--card);border:2px solid var(--line);overflow:hidden}
.lid{background:hsl(var(--h) 80% 82%);border-bottom:6px solid hsl(var(--h) 65% 68%);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:#4a2c2a}
.tn{font-size:20px;font-weight:600}
.badge{font-size:12px;font-weight:800;border-radius:99px;padding:4px 10px;white-space:nowrap}
.Available{background:#dff5e6;color:#1b6e39}.Low{background:#ffefc7;color:#8a5a00}.Sold{background:#fde0e0;color:#a52626}
.tb{padding:14px 16px 12px;text-align:center}
.count{font-size:54px;font-weight:600;line-height:1}.unit{color:var(--mute);font-size:13px;margin-bottom:8px}
.meter{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:12px}
.meter i{width:12px;height:12px;border-radius:50%;background:var(--sky)}.meter i.on{background:hsl(var(--h) 70% 70%)}
.act{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:14px}
.act button{padding:12px 4px;color:#fff;font-weight:700;font-size:14px}
.a{background:var(--berry)}.s{background:#8a7370}.d{background:var(--blue)}
.del{background:none;color:var(--mute);font-size:13px;margin-top:8px;padding:6px 10px;text-decoration:underline}
form{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:190px;font:inherit;padding:14px 18px;border-radius:99px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:18px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:8px 18px}
ul{list-style:none;padding:0;margin:0}
li{padding:11px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:15px}
li:last-child{border:0}li small{color:var(--mute);white-space:nowrap}
.empty{color:var(--mute);padding:12px 0}
#login{max-width:400px;margin:12vh auto 0;text-align:center}
#login .logo{margin:0 auto 14px;width:76px;height:76px;font-size:40px}
#login form{flex-direction:column;margin-top:18px}#lerr{color:#c0392b;min-height:20px}
dialog{border:0;border-radius:26px;padding:22px;background:var(--card);color:var(--ink);width:min(420px,92vw)}dialog::backdrop{background:#2b1a1a88}
.dact{display:flex;gap:10px;margin-top:14px}.dact button{flex:1}
@media(max-width:760px){.strip,.two{grid-template-columns:1fr}.strip>div+div{border-left:0;border-top:2px dashed var(--line)}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
.frog{background:none;font-size:26px;padding:4px 8px;position:relative}
.frog.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-16px) rotate(-8deg)}}
.say{position:absolute;left:100%;bottom:70%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:2px 10px;font-size:14px;white-space:nowrap;color:var(--ink)}
.foot{margin-top:36px;text-align:center;color:var(--mute);font-size:13px}
.rain{position:fixed;top:-40px;font-size:28px;pointer-events:none;animation:fall 2.6s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.frog.hop,.rain{animation:none}.rain{display:none}}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="logo">🍦</div><h1 class="brandname"></h1>
  <p class="sub">Sign in to open the freezer.</p>
  <form id="lf"><input id="em" type="email" placeholder="Email" autocomplete="username" required><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required><button class="btn" type="submit">Sign in</button></form>
  <p id="lerr" role="alert"></p>
</div>
<div id="app" hidden>
<div class="top"><div class="brand"><div class="logo">🍦</div><div><h1 class="brandname"></h1><small>Freezer inventory</small></div></div><button class="btn alt" id="out">Sign out</button></div>
<div class="strip" id="stats"></div>
<h2>In the freezer</h2>
<div id="flavors" class="grid"></div>
<h2>Add a flavor</h2>
<form id="add"><input id="fname" placeholder="Flavor name, e.g. Mint chip" maxlength="40" required><button class="btn" type="submit">Add flavor</button><button class="btn alt" type="button" id="demo">Load sample flavors</button></form>
<div class="two"><div><h2>Business deliveries</h2><div class="card"><ul id="biz"></ul></div></div>
<div><h2>Recent activity</h2><div class="card"><ul id="log"></ul></div></div></div>
<div class="foot">Made with love and a little help from a friend <button class="frog" id="frog" aria-label="Frog">🐸</button></div>
</div>
<dialog id="dlg"><form method="dialog" id="df"><h2 style="margin:0 0 12px" id="dt">Deliver</h2>
<input id="bn" list="bl" placeholder="Business name" maxlength="60" required style="width:100%"><datalist id="bl"></datalist>
<div class="dact"><button class="btn alt" type="button" id="dc">Cancel</button><button class="btn" type="submit">Save delivery</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 1) Paste your Supabase values here (Project Settings > API). The anon key is meant to be public.
const SUPABASE_URL="PASTE_PROJECT_URL_HERE", SUPABASE_KEY="PASTE_ANON_KEY_HERE";
const BRAND="Super Duper Cool Ice Cream"; // your business name shows in the header
const LOW=2; // "Low" = this many buckets or fewer
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const status=n=>n<=0?["Sold Out","Sold"]:n<=LOW?["Low","Low"]:["Available","Available"];
let F=[],A=[],pending=null,chan=null;
const fail=e=>alert(e.message||e);

async function load(){
  const since=new Date(Date.now()-7*864e5).toISOString();
  const [f,a]=await Promise.all([
    sb.from("flavors").select("*").order("name"),
    sb.from("activity").select("*").gte("created_at",since).order("created_at",{ascending:false}).limit(1000)]);
  if(f.error||a.error)return fail(f.error||a.error);
  F=f.data;A=a.data;render();
}
async function act(id,type,business){
  const {error}=await sb.rpc("change_bucket",{p_flavor:id,p_type:type,p_business:business||null});
  if(error)fail(error);
  load();
}
const LBL={added:"➕ Added",sold:"➖ Sold",delivered:"🚚 Delivered"};
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h};
function render(){
  document.querySelectorAll(".brandname").forEach(e=>e.textContent=BRAND);
  document.title=BRAND+" · Freezer";
  $("flavors").innerHTML=F.length?F.map(f=>{const [l,c]=status(f.count);
    const dots=Array.from({length:10},(_,i)=>`<i class="${i<f.count?"on":""}"></i>`).join("");
    return `<div class="tub" style="--h:${hue(f.name)}"><div class="lid"><span class="tn">${esc(f.name)}</span><span class="badge ${c}">${l}</span></div>
    <div class="tb"><div class="count">${f.count}</div><div class="unit">${f.count===1?"bucket":"buckets"} ready to sell</div><div class="meter" aria-hidden="true">${dots}</div>
    <div class="act"><button class="a" data-id="${f.id}" data-t="added">➕ Add</button><button class="s" data-id="${f.id}" data-t="sold">➖ Sold</button><button class="d" data-id="${f.id}" data-t="delivered">🚚 Deliver</button></div>
    <button class="del" data-del="${f.id}">Remove flavor</button></div></div>`}).join(""):
    `<div class="empty">🐸 The freezer is empty, and the frog is worried. Add your first flavor below, or load the sample flavors.</div>`;
  const day=new Date().setHours(0,0,0,0);
  const n=(t,from)=>A.filter(e=>e.type===t&&new Date(e.created_at)>=from).length;
  const total=F.reduce((s,f)=>s+f.count,0);
  const per=(t,from)=>`<div class="per"><h3>${t}</h3><p><b>${n("added",from)}</b>added</p><p><b>${n("sold",from)}</b>sold</p><p><b>${n("delivered",from)}</b>delivered to businesses</p></div>`;
  $("stats").innerHTML=`<div class="big"><b>${total}</b><span>buckets in the freezer now</span></div>${per("Today",day)}${per("Last 7 days",0)}`;
  const by={};A.filter(e=>e.type==="delivered"&&e.business).forEach(e=>by[e.business]=(by[e.business]||0)+1);
  $("biz").innerHTML=Object.keys(by).length?Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([b,c])=>`<li><span>${esc(b)}</span><b>${c}</b></li>`).join(""):`<div class="empty">No deliveries in the last 7 days.</div>`;
  $("bl").innerHTML=Object.keys(by).map(b=>`<option value="${esc(b)}">`).join("");
  $("log").innerHTML=A.length?A.slice(0,15).map(e=>{
    const t=new Date(e.created_at).toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    return `<li><span>${LBL[e.type]}: ${esc(e.flavor_name)}${e.business?" to "+esc(e.business):""}</span><small>${t}</small></li>`}).join(""):`<div class="empty">Activity will show up here as you add, sell, and deliver.</div>`;
}
$("flavors").onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.del){const f=F.find(x=>x.id===b.dataset.del);
    if(f&&confirm(`Remove "${f.name}"?`)){const {error}=await sb.from("flavors").delete().eq("id",f.id);if(error)fail(error);load()}}
  else if(b.dataset.t==="delivered"){const f=F.find(x=>x.id===b.dataset.id);
    if(f.count<=0)return alert("That flavor is sold out.");
    pending=f.id;$("dt").textContent="Deliver "+f.name+" to a business";$("bn").value="";$("dlg").showModal()}
  else act(b.dataset.id,b.dataset.t);
};
$("df").onsubmit=()=>{const b=$("bn").value.trim();if(pending&&b)act(pending,"delivered",b);pending=null};
$("dc").onclick=()=>$("dlg").close();
$("add").onsubmit=async e=>{e.preventDefault();const name=$("fname").value.trim();if(!name)return;
  const {error}=await sb.from("flavors").insert({name});if(error)fail(error);$("fname").value="";load()};
$("demo").onclick=async()=>{const names=["Vanilla Bean","Chocolate","Strawberry","Mint Chip","Cookie Dough"];
  const rows=names.filter(n=>!F.some(f=>f.name===n)).map((name,i)=>({name,count:[5,3,2,1,0][i]}));
  if(rows.length){const {error}=await sb.from("flavors").insert(rows);if(error)fail(error)}load()};
$("out").onclick=()=>sb.auth.signOut();
$("lf").onsubmit=async e=>{e.preventDefault();$("lerr").textContent="";
  const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(error)$("lerr").textContent=error.message};
function show(session){
  $("login").hidden=!!session;$("app").hidden=!session;
  if(chan){sb.removeChannel(chan);chan=null}
  if(session){load();chan=sb.channel("live").on("postgres_changes",{event:"*",schema:"public"},load).subscribe()}
}
sb.auth.onAuthStateChange((_e,s)=>show(s));
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!$("app").hidden)load()});

// Easter eggs 🐸: tap the little frog at the bottom, or tap the logo 5 times
const RIBBIT=["ribbit!","ribbit ribbit","brrrrribbit","got any mint chip?","hop hop!","froggy approves 🍦"];
let taps=0,tt;
$("frog").onclick=e=>{const b=e.currentTarget;b.classList.remove("hop");void b.offsetWidth;b.classList.add("hop");
  b.querySelector(".say")?.remove();const m=document.createElement("span");m.className="say";
  m.textContent=RIBBIT[Math.floor(Math.random()*RIBBIT.length)];b.appendChild(m);setTimeout(()=>m.remove(),1400)};
document.addEventListener("click",e=>{if(!e.target.closest(".logo"))return;
  taps++;clearTimeout(tt);tt=setTimeout(()=>taps=0,1500);
  if(taps>=5){taps=0;for(let i=0;i<24;i++){const f=document.createElement("span");f.className="rain";f.textContent="🐸";
    f.style.left=Math.random()*95+"vw";f.style.animationDelay=Math.random()*1.2+"s";document.body.appendChild(f);setTimeout(()=>f.remove(),4200)}}});
</script>
</body>
</html>
